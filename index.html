<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Marque</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e6fff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Marque">
<style>
:root{--bg:#f4f5f7;--fg:#14171a;--card:#fff;--mut:#667;--ac:#1e6fff;--bd:#dde;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--fg:#eef0f2;--card:#1b1e23;--mut:#9aa;--bd:#333}}
:root[data-theme="dark"]{--bg:#101215;--fg:#eef0f2;--card:#1b1e23;--mut:#9aa;--bd:#333}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font-size:16px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:10px}
button.s{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
button.d{background:#c62828}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{margin:0;border-radius:0;background:none;color:var(--mut);font-size:13px;padding:14px 2px}
nav button.on{color:var(--ac)}
.it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.V{color:#1faa59;font-weight:700}.D{color:#e53935;font-weight:700}
.big{font-size:40px;font-weight:800}.mut{color:var(--mut);font-size:14px}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw i{width:38px;height:38px;border-radius:50%;border:3px solid transparent}.sw i.on{border-color:var(--fg)}
#live{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:9;user-select:none;-webkit-user-select:none}
.z{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;color:#fff}
.z .n{font-size:26px;font-weight:700}.z .sc{font-size:min(30vh,34vw);font-weight:900;line-height:1}.z .ss{font-size:18px;opacity:.9}
#bar{background:#111;color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px}
#bar .inf{font-size:12px;opacity:.8;flex:1;white-space:nowrap}#bar button{width:auto;margin:0;padding:10px 9px;font-size:14px;background:#333;white-space:nowrap}
.dots{display:flex;gap:3px;flex:2;justify-content:center}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff4}
@media (orientation:landscape){#live{flex-direction:row;flex-wrap:wrap}.z{flex:1 1 50%;height:calc(100% - 64px)}.z .sc{font-size:min(54vh,24vw)}.z .n{font-size:min(8vh,4vw)}.z .ss{font-size:min(6vh,3vw)}#bar{flex:0 0 100%;height:64px}#bar .inf{font-size:14px}.dots{flex:2 1 auto;order:0;padding:0;gap:6px}.dots i{width:22px;height:22px}}
.z{position:relative}
.q{position:absolute;inset:0;background:inherit;display:flex;flex-direction:column;gap:8px;padding:8px;z-index:2}
.q .g{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;min-height:0}
.q button{margin:0;width:auto;min-width:0;min-height:0;padding:4px;background:#0007;color:#fff;border-radius:14px;font-size:clamp(13px,3.6vmin,20px);font-weight:700;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.q button span{font-size:clamp(26px,8vmin,46px);line-height:1}
.q .t{flex:0 0 22%}
.q .p{flex:0 0 38px;background:#0004;font-size:13px;font-weight:600;padding:0}
details.fu{margin:10px 0 4px;background:var(--bg);border-radius:10px;padding:8px 12px}
details.fu summary{cursor:pointer;color:var(--ac);font-weight:700;padding:4px 0}
details.fu p,details.fu li{font-size:14px;line-height:1.4}
details.fu ul{padding-left:18px;margin:8px 0 4px}details.fu li{margin:6px 0}
:root[data-theme="sun"]{color-scheme:light;--bg:#fff;--fg:#000;--card:#fff;--mut:#1a1a1a;--bd:#000;--ac:#0036b8}
:root[data-theme="sun"] body{font-weight:600}
:root[data-theme="sun"] .card{border-width:2px}
:root[data-theme="sun"] .z .n,:root[data-theme="sun"] .z .sc,:root[data-theme="sun"] .z .ss{text-shadow:0 0 6px #000a,0 2px 0 #0008}
:root[data-theme="sun"] #bar{background:#000}
:root[data-theme="sun"] .q button{background:#000d}
.btnl{display:block;text-align:center;font-size:16px;padding:14px;border-radius:12px;font-weight:600;margin-top:10px;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
#toast{position:fixed;top:12%;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:20px;z-index:20;display:none}
#ov{z-index:5;position:absolute;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center;gap:6px}
#ov button{max-width:320px}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="live" style="display:none"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C={Bleu:'#1e6fff',Rouge:'#e53935',Vert:'#1faa59',Orange:'#fb8c00',Violet:'#8e44ad',Jaune:'#f5c400'};
const P={ff:{w:3,s:25,d:15,e:2},loisir:{w:2,s:21,d:15,e:2}};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{if(k==='vs_team'||k==='vs_cfg'){k='vs_teams';v=teams}try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let teams=ld('vs_teams',null),hist=ld('vs_hist',[]),live=ld('vs_live',null),cur=ld('vs_cur',''),team,cfg,wl=null,mf={};
if(!teams){const o=ld('vs_team',null),c=ld('vs_cfg',{...P.ff,p:'ff'});teams=o&&o.name?[{id:'t1',name:o.name,cat:o.cat,season:o.season,cfg:c}]:[];sv('vs_teams',teams)}
if(cur!=='all'&&!teams.some(t=>t.id===cur))cur=teams[0]?teams[0].id:'';
hist.forEach(m=>{if(!m.t&&teams[0])m.t=teams[0].id});
hist.forEach(m=>{if(m.tr===undefined&&m.w===1&&!m.int&&!m.ff&&(m.sets||[]).length>1)m.w=Math.max(m.sw,m.sl)});hist.forEach(m=>{if(!m.id)m.id=legacyId(m)});sv('vs_hist',hist);
const T=()=>teams.find(t=>t.id===cur);
function sync(){if($('#live').style.display==='none')unwake();team=T()||{name:'',cat:'',season:''};if(team.id&&!team.cfg)team.cfg={...P.ff,p:'ff'};cfg=team.cfg||{...P.ff,p:'ff'}}
const ok=m=>cur==='all'||m.t===cur;
const tr=m=>m.tr!==undefined?!!m.tr:(m.w||3)===1;
const pts=m=>{if(tr(m))return 0;if(m.ff)return m.ff===2?4:0;const w=m.w||3;if(m.tie)return m.res==='V'?3:2;return m.res==='V'?(w<2||m.sl<w-1?4:3):(w>1&&m.sw===w-1?2:1)};
const rl=m=>m.ff?(m.ff===2?'Forfait adverse':'Forfait'):(m.res==='V'?'Victoire':'Défaite')+' '+m.sw+'-'+m.sl;
const BM=`<button class="s" onclick="nav('manual')">+ Saisir un match non suivi</button>`;
const sel=a=>teams.length?`<select style="margin-bottom:10px" onchange="cur=this.value;sv('vs_cur',cur);render()">${teams.map(t=>`<option value="${t.id}" ${cur===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}${a&&teams.length>1?`<option value="all" ${cur==='all'?'selected':''}>Toutes mes équipes</option>`:''}</select>`:'';
const bars=rows=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span style="width:92px;font-size:13px">${r[0]}</span><div style="flex:1;background:var(--bg);border-radius:6px"><div style="width:${100*r[1]/mx}%;min-width:3px;height:22px;border-radius:6px;background:${r[2]}"></div></div><b>${r[1]}</b></div>`).join('')};
const tt=()=>`<h2>Par équipe</h2><div class="card">${teams.map(t=>{const L=hist.filter(m=>m.t===t.id&&!tr(m)),w=L.filter(m=>m.res==='V').length;return `<div class="it"><b>${esc(t.name)}</b><span class="mut">${L.length} m · ${w} V · ${L.reduce((a,m)=>a+pts(m),0)} pts</span></div>`}).join('')}</div>`;
const tm=()=>`<h2>Mes équipes</h2><div class="card">${teams.map(t=>`<div class="it" onclick="cur='${t.id}';sv('vs_cur',cur);render()"><b>${esc(t.name)||'(sans nom)'}</b><span class="${t.id===cur?'V':'mut'}">${t.id===cur?'● active':'choisir'}</span></div>`).join('')}<label>Nouvelle équipe</label><div class="row"><input id="nt" placeholder="Nom de l'équipe"><button style="margin:0;flex:0 0 100px" onclick="addT()">Ajouter</button></div>${T()?`<button class="d" onclick="delT(this)">Supprimer l'équipe active</button>`:''}</div>`;
let view='match',detail=null,form={cA:'Rouge',cB:'Bleu',home:'D',date:new Date().toISOString().slice(0,10),opp:'',comp:''};
const tc=c=>c==='Jaune'?'#111':'#fff';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1400)}
function nav(v){view=v;detail=null;if(v!=='manual')mf={};if(v!=='hist'&&v!=='stats'&&cur==='all'){cur=teams[0]?teams[0].id:'';sv('vs_cur',cur)}render()}
function render(){sync();hsync();
 $('#nav').innerHTML=[['match','Match'],['hist','Historique'],['stats','Saison'],['set','Réglages']].map(([k,l])=>`<button class="${view===k?'on':''}" onclick="nav('${k}')">${l}</button>`).join('');
 const a=$('#app');
 if(view==='match')a.innerHTML=vMatch();else if(view==='hist')a.innerHTML=detail!==null?vDetail():vHist();else if(view==='stats')a.innerHTML=vStats();else if(view==='manual')a.innerHTML=vManual();else a.innerHTML=vSet();const fz=$('#frz');if(fz)fz.scrollLeft=fz.scrollWidth;
}
function sw(k){return `<div class="sw">${Object.keys(C).map(c=>`<i class="${form[k]===c?'on':''}" style="background:${C[c]}" onclick="form.${k}='${c}';render()"></i>`).join('')}</div>`}
function vMatch(){
 return `<h1>🏐 La Marque</h1>${sel(0)}${rap()}`+(live?`<div class="card"><b>Match en cours</b><div class="mut">${esc(live.team)} vs ${esc(live.opp)}</div><button onclick="showLive()">Reprendre le match</button><button class="s" onclick="aband(this)">Abandonner ce match</button></div><h2>Nouveau match</h2>`:'<h2>Nouveau match</h2>')+
 `<div class="card"><div class="mut">Mon équipe : <b>${esc(team.name)||'à renseigner dans Réglages'}</b></div>
 <label>Adversaire</label><input value="${esc(form.opp)}" oninput="form.opp=this.value">
 <div class="row"><div><label>Date</label><input type="date" value="${form.date}" oninput="form.date=this.value"></div><div><label>Lieu</label><select onchange="form.home=this.value"><option value="D" ${form.home==='D'?'selected':''}>Domicile</option><option value="E" ${form.home==='E'?'selected':''}>Extérieur</option></select></div></div>
 <label>Compétition</label><input value="${esc(form.comp)}" oninput="form.comp=this.value">
 <label>Couleur de mon équipe</label>${sw('cA')}<label>Couleur de l'adversaire</label>${sw('cB')}
 <div class="mut" style="margin-top:10px">Règles : ${cfg.w} sets gagnants, ${cfg.s} pts, décisif ${cfg.d} pts, écart ${cfg.e}</div>
 <label><input type="checkbox" style="width:auto" ${(form.tr===undefined?cfg.w===1:form.tr)?'checked':''} onchange="form.tr=this.checked"> Entraînement (points non comptés au classement)</label><label><input type="checkbox" style="width:auto" ${(form.adv===undefined?!!team.adv:form.adv)?'checked':''} onchange="form.adv=this.checked"> Mode avancé : qualifier les points (attaque, ace, fautes…)</label><button onclick="start(this)">Démarrer le match</button><button class="s" onclick="nav('manual')">Saisir un match non suivi</button></div>`;
}
function vHist(){
 if(!hist.some(ok))return `<h1>Historique</h1>${sel(1)}${BM}<div class="card mut" style="margin-top:10px">Aucun match enregistré.</div>`;
 return `<h1>Historique</h1>${sel(1)}${frise()}${BM}<div class="card" style="margin-top:10px">${hist.map((m,i)=>!ok(m)?'':`<div class="it" style="${tr(m)?'opacity:.55;border-left:3px dashed var(--mut);padding-left:8px':''}" onclick="detail=${i};render()"><div><b>${esc(m.opp)}</b><div class="mut">${m.date}${m.comp?' · '+esc(m.comp):''}</div></div><div class="${tr(m)?'mut':m.res}">${rl(m)}<div class="mut" style="text-align:right">${tr(m)?'Entraînement':(m.int?'interrompu'+(m.tie?' · écart '+fd(m):'')+' · ':'')+pts(m)+' pt'+(pts(m)>1?'s':'')}</div></div></div>`).join('')}</div>`;
}
function vDetail(){
 const m=hist[detail];
 return `<h1>${esc(m.opp)}</h1><div class="card">${phTop(m)}<div class="mut">${m.date} · ${m.home==='D'?'Domicile':'Extérieur'}${m.comp?' · '+esc(m.comp):''}</div><div class="big ${tr(m)?'mut':m.res}">${rl(m)}</div><div class="mut">${tr(m)?'Entraînement (hors classement)':pts(m)+' point'+(pts(m)>1?'s':'')+' au classement'}</div>${m.int?'<div class="card" style="margin-top:10px;background:var(--bg)"><b>Match interrompu</b>'+(m.tie?'<div>Départagé à la différence de points : <b class="'+m.res+'">'+fd(m)+'</b> ('+pd(m).a+' - '+pd(m).b+')</div>':'')+'</div>':''}${m.sets.map((s,i)=>`<div class="it"><span>Set ${i+1}</span><b>${s[0]} - ${s[1]}</b></div>`).join('')}
 ${seqs(m)}${m.adv?qstats(m):''}${phBtn(m)}<button class="s" onclick="fiche(${detail})">📤 Partager la fiche (A4)</button><button onclick="editM(${detail})">Modifier ce match</button><button class="s" onclick="detail=null;render()">← Retour</button><button class="d" onclick="if(this.dataset.c){delPh(hist[${detail}].id);hist.splice(${detail},1);sv('vs_hist',hist);detail=null;render()}else{this.dataset.c=1;this.textContent='Confirmer la suppression'}">Supprimer ce match</button></div>`;
}
function vStats(){
 const n=hist.length,w=hist.filter(m=>m.res==='V').length,sw=hist.reduce((a,m)=>a+m.sw,0),sl=hist.reduce((a,m)=>a+m.sl,0);
 return `<h1>Saison</h1><div class="card"><div class="big">${n?Math.round(100*w/n):0} %</div><div class="mut">de victoires</div>
 <div class="it"><span>Matchs joués</span><b>${n}</b></div><div class="it"><span>Victoires</span><b class="V">${w}</b></div><div class="it"><span>Défaites</span><b class="D">${n-w}</b></div><div class="it"><span>Sets gagnés</span><b>${sw}</b></div><div class="it"><span>Sets perdus</span><b>${sl}</b></div></div>
 <button onclick="exp()">Exporter la saison (CSV)</button><div id="csv"></div>`;
}
function exp(){
 const t='Date;Adversaire;Résultat;Sets_Gagnés;Sets_Perdus;Détail_Sets\n'+hist.map(m=>[m.date,m.opp,m.res==='V'?'Victoire':'Défaite',m.sw,m.sl,m.sets.map(s=>s[0]+'-'+s[1]).join(' ')].map(x=>String(x).replace(/;/g,',')).join(';')).join('\n');
 $('#csv').innerHTML=`<div class="card"><textarea id="ta" rows="8" readonly>${esc(t)}</textarea><button onclick="cp()">Copier le CSV</button><div class="mut">Colle-le dans un fichier .csv ou directement dans Excel / LibreOffice.</div></div>`;
}
function cp(){const t=$('#ta');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(_){}}toast('Copié')}
function vSet(){
 if(!team.id)return'<h1>Réglages</h1>'+tm()+pf()+stf()+BKC;const o=(v,l)=>`<option value="${v}" ${cfg.p===v?'selected':''}>${l}</option>`;
 const n=(k,l)=>`<label>${l}</label><input type="number" inputmode="numeric" value="${cfg[k]}" oninput="cfg.${k}=+this.value;cfg.p='perso';sv('vs_cfg',cfg)">`;
 return `<h1>Réglages</h1>${tm()}<h2>Profil de l'équipe</h2><div class="card"><label>Nom</label><input value="${esc(team.name)}" oninput="team.name=this.value;sv('vs_team',team)"><div class="row"><div><label>Catégorie</label><input value="${esc(team.cat)}" oninput="team.cat=this.value;sv('vs_team',team)"></div><div><label>Saison</label><input value="${esc(team.season)}" oninput="team.season=this.value;sv('vs_team',team)"></div></div></div>
 <h2>Règles du match</h2><div class="card"><label>Préconfiguration</label><select onchange="pre(this.value)">${o('ff','FFVolley classique')}${o('loisir','Loisir')}${o('perso','Personnalisé')}</select>
 <label>Sets gagnants</label><select onchange="cfg.w=+this.value;cfg.p='perso';sv('vs_cfg',cfg)"><option ${cfg.w===1?'selected':''}>1</option><option ${cfg.w===2?'selected':''}>2</option><option ${cfg.w===3?'selected':''}>3</option></select>
 ${n('s','Points d\'un set classique')}${n('d','Points du set décisif')}${n('e','Écart minimum')}<label><input type="checkbox" style="width:auto" ${team.adv?'checked':''} onchange="team.adv=this.checked;sv('vs_team')"> Mode avancé par défaut (qualifier les points)</label></div>${pf()}${stf()}${BKC}`;
}
function pre(p){if(!team.id)return;if(P[p])team.cfg=cfg={...P[p],p};else cfg.p='perso';sv('vs_cfg');render()}
function start(b){
 if(live&&b&&!b.dataset.c){b.dataset.c=1;b.textContent='Un match est à reprendre : le remplacer ?';b.className='d';setTimeout(()=>{b.dataset.c='';b.textContent='Démarrer le match';b.className=''},4000);return}
 if(!team.id||!team.name.trim()){toast('Renseigne ton équipe dans Réglages');return}
 if(form.cA===form.cB){toast('Choisis deux couleurs différentes');return}
 live={adv:(form.adv===undefined?!!team.adv:form.adv)?1:0,qs:{},tr:(form.tr===undefined?cfg.w===1:form.tr)?1:0,tid:team.id,team:team.name,opp:form.opp.trim()||'Adversaire',comp:form.comp,date:form.date,home:form.home,cA:form.cA,cB:form.cB,cfg:{...cfg},sets:[],cur:{a:0,b:0,pts:[]},swap:false,pend:false};
 sv('vs_live',live);showLive();
}
function tgt(){const L=live;return L.sets.length+1===2*L.cfg.w-1&&L.cfg.w>1?L.cfg.d:L.cfg.s}
function over(){const c=live.cur,t=tgt();return Math.max(c.a,c.b)>=t&&Math.abs(c.a-c.b)>=live.cfg.e}
function wins(inc){const L=live;let a=L.sets.filter(s=>s[0]>s[1]).length,b=L.sets.filter(s=>s[1]>s[0]).length;if(inc){if(L.cur.a>L.cur.b)a++;else b++}return[a,b]}
function showLive(){live.qo=null;live.qp=null;$('#live').style.display='flex';hsync();renderLive();wake()}
function renderLive(){
 const L=live,[sa,sb]=wins(false);
 const Z=t=>{const c=t==='a'?L.cA:L.cB;return `<div class="z" data-t="${t}" style="background:${C[c]};color:${tc(c)}"><div class="n">${esc(t==='a'?L.team:L.opp)}</div><div class="sc">${L.cur[t]}</div><div class="ss">Sets : ${t==='a'?sa:sb}</div>${L.qp===t?qpanel(t):''}</div>`};
 const order=L.swap?['b','a']:['a','b'];
 const dots=L.cur.pts.slice(innerHeight>innerWidth?-7:-10).map(t=>`<i style="background:${C[t==='a'?L.cA:L.cB]}"></i>`).join('');
 let ov='';
 if(L.pend){
  const [a,b]=wins(true),fin=a>=L.cfg.w||b>=L.cfg.w,win=a>b;
  ov=`<div id="ov"><div class="big">${fin?(win?'Victoire ':'Défaite ')+a+'-'+b:'Set terminé'}</div><div style="font-size:22px">${L.cur.a} - ${L.cur.b}</div><button onclick="conf()">${fin?'Enregistrer le match':'Set suivant'}</button><button class="s" onclick="undo()">↓ Annuler le dernier point</button></div>`;
 }
